<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado por Voz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #1a3636;
      --secondary-color: #0f2727;
      --accent-color: #db4437;
      --text-color: #333;
      --light-text: #fff;
      --border-color: #ddd;
      --bg-color: #fff;
      --hover-bg: #f5f5f5;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #2c5454;
        --secondary-color: #1a3636;
        --accent-color: #ff5a5a;
        --text-color: #eee;
        --light-text: #fff;
        --border-color: #444;
        --bg-color: #333;
        --hover-bg: #444;
      }
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: var(--text-color);
      background-color: var(--bg-color);
    }
    
    .popup-header {
      background-color: var(--primary-color);
      color: var(--light-text);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    
    .popup-header h1 {
      font-size: 16px;
      font-weight: 500;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #888;
    }
    
    .status-indicator.active {
      background-color: #4CAF50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
    }
    
    .popup-content {
      padding: 15px;
    }
    
    .control-group {
      margin-bottom: 12px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 500;
    }
    
    .control-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary-color);
      color: var(--light-text);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    
    .control-btn:hover {
      background-color: var(--secondary-color);
    }
    
    .control-btn i {
      margin-right: 8px;
    }
    
    .control-btn.active {
      background-color: var(--accent-color);
    }
    
    .control-btn.active:hover {
      background-color: #c53929;
    }
    
    .control-btn.command-btn {
      background-color: #4285f4;
    }
    
    .control-btn.command-btn:hover {
      background-color: #3367d6;
    }
    
    .control-btn.settings-btn {
      background-color: #888;
    }
    
    .control-btn.settings-btn:hover {
      background-color: #666;
    }
    
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
    }
    
    select:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    
    .shortcuts {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
    }
    
    .shortcuts h3 {
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    .shortcuts ul {
      list-style: none;
      padding-left: 5px;
    }
    
    .shortcuts li {
      margin-bottom: 3px;
      display: flex;
      align-items: center;
    }
    
    .shortcut-key {
      background-color: var(--hover-bg);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 1px 4px;
      margin-right: 5px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>Dictado por Voz</h1>
    <div id="status-indicator" class="status-indicator" title="Dictado inactivo"></div>
  </div>
  
  <div class="popup-content">
    <div class="control-group">
      <button id="toggle-dictation" class="control-btn">
        <i class="fas fa-microphone"></i> Iniciar dictado
      </button>
    </div>
    
    <div class="control-group">
      <button id="toggle-command-mode" class="control-btn command-btn">
        <i class="fas fa-terminal"></i> Modo comando
      </button>
    </div>
    
    <div class="control-group">
      <label for="language-select">Idioma:</label>
      <select id="language-select">
        <option value="es-ES">Español</option>
        <option value="en-US">English</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="it-IT">Italiano</option>
        <option value="pt-BR">Português</option>
      </select>
    </div>
    
    <div class="control-group">
      <button id="open-settings" class="control-btn settings-btn">
        <i class="fas fa-cog"></i> Configuración
      </button>
    </div>
    
    <div class="shortcuts">
      <h3>Atajos de teclado:</h3>
      <ul>
        <li><span class="shortcut-key">Alt+D</span> Iniciar/Detener dictado</li>
        <li><span class="shortcut-key">Alt+C</span> Modo comando</li>
        <li><span class="shortcut-key">Alt+S</span> Abrir configuración</li>
      </ul>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
